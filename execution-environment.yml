---
version: 3

images:
  base_image:
    name: quay.io/centos/centos:stream9

dependencies:
  ansible_core:
    # Require minimum of 2.15 to get ansible-inventory --limit option
    package_pip: ansible-core>=2.16.4
  ansible_runner:
    package_pip: ansible-runner
  python_interpreter:
    package_system: "python3.11"
    python_path: "/usr/bin/python3.11"
  python: requirements.txt
    # git+https://github.com/ansible/ansible-sign
    # ncclient
    # paramiko
    # pykerberos
    # pyOpenSSL
    # pypsrp[kerberos,credssp]
    # pywinrm[kerberos,credssp]
    # toml
    # pexpect>=4.5
    # python-daemon
    # pyyaml
    # six
    # receptorctl
  system: |
    git-core [platform:rpm]
    python3.11-devel [platform:rpm compile]
    libcurl-devel [platform:rpm compile]
    krb5-devel [platform:rpm compile]
    krb5-workstation [platform:rpm]
    subversion [platform:rpm]
    subversion [platform:dpkg]
    git-lfs [platform:rpm]
    sshpass [platform:rpm]
    rsync [platform:rpm]
    epel-release [platform:rpm]
    python-unversioned-command [platform:rpm]
    unzip [platform:rpm]
    podman-remote [platform:rpm]
    cmake [platform:rpm compile]
    gcc [platform:rpm compile]
    gcc-c++ [platform:rpm compile]
    make [platform:rpm compile]
    openssl-devel [platform:rpm compile]

additional_build_steps:

  prepend_base: 
    - RUN alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 0
  append_base:
    - RUN $PYCMD -m pip install -U pip
  # Bake this branch's kubespray into the image, so the EE tag alone sets the
  # kubespray version (DO-404). The workflow builds the collection tarball
  # into ee-collections/ before ansible-builder runs. --no-deps: kubespray's
  # galaxy.yml dependencies all ship in the pinned `ansible` package from
  # requirements.txt, and the image should use those, not newer Galaxy ones.
  append_final:
    - COPY _build/collections/ /tmp/kubespray-collection/
    - RUN ansible-galaxy collection install --no-deps -p /usr/share/ansible/collections /tmp/kubespray-collection/*.tar.gz && rm -rf /tmp/kubespray-collection

additional_build_files:
  - src: ee-collections
    dest: collections
